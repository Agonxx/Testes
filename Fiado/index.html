<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fiado">
<title>Controle de Fiado</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --primary:       #1a1a2e;
  --primary-mid:   #16213e;
  --accent:        #e94560;
  --accent-dim:    rgba(233,69,96,0.12);
  --green:         #27ae60;
  --green-dim:     rgba(39,174,96,0.12);
  --text:          #1c1c1e;
  --text-sub:      #6e6e73;
  --bg:            #f2f2f7;
  --card:          #ffffff;
  --border:        #e5e5ea;
  --red:           #e74c3c;
  --red-bg:        #fff0ef;
  --gray-text:     #8e8e93;
  --radius:        12px;
  --radius-sm:     8px;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  max-width: 430px;
  margin: 0 auto;
  overflow-x: hidden;
  overscroll-behavior: none;
  -webkit-overflow-scrolling: touch;
}

/* ── Screens ── */
.screen { display: none; min-height: 100vh; min-height: 100dvh; flex-direction: column; }
.screen.active { display: flex; }

/* ── Header ── */
.header {
  background: var(--primary);
  color: #fff;
  padding: 14px 16px;
  padding-top: calc(14px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 1px 0 rgba(255,255,255,0.06);
}
.header h1 { font-size: 17px; font-weight: 600; flex: 1; letter-spacing: -0.2px; }
.btn-back {
  background: none; border: none; color: #fff;
  font-size: 22px; cursor: pointer; padding: 2px 6px;
  border-radius: 6px; line-height: 1;
}
.btn-back:active { background: rgba(255,255,255,0.12); }
.header-actions { display: flex; gap: 6px; }
.btn-icon {
  background: rgba(255,255,255,0.1); border: none; color: #fff;
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.btn-icon:active { background: rgba(255,255,255,0.22); }

/* ── Scroll content ── */
.content { flex: 1; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pb-fab   { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }

/* ── Buttons ── */
.btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 14px;
  border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn:active { opacity: .82; transform: scale(.98); }
.btn-primary  { background: var(--accent); color: #fff; }
.btn-dark     { background: var(--primary); color: #fff; }
.btn-green    { background: var(--green);   color: #fff; }
.btn-neutral  { background: var(--border);  color: var(--text); }

.btn-fab {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom));
  right: max(16px, env(safe-area-inset-right));
  width: 54px; height: 54px;
  border-radius: 50%;
  background: var(--accent); color: #fff;
  border: none; font-size: 30px; line-height: 1;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(233,69,96,.45);
  display: flex; align-items: center; justify-content: center;
}
.btn-fab:active { transform: scale(.92); }

/* ── Forms ── */
.form-group { margin-bottom: 14px; }
label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-sub); text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 6px;
}
.form-control {
  width: 100%; padding: 13px 14px;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  font-size: 16px; color: var(--text); background: var(--card);
  -webkit-appearance: none; appearance: none;
  transition: border-color .2s;
}
.form-control:focus { outline: none; border-color: var(--accent); }

/* ── Search bar ── */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap .form-control { padding-left: 38px; }
.search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-sub); font-size: 15px; pointer-events: none;
}

/* ── Cards ── */
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
}
.card-tap { cursor: pointer; }
.card-tap:active { transform: scale(.992); opacity: .9; }

/* ── Cliente card ── */
.client-row { display: flex; align-items: center; gap: 13px; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--primary-mid); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; flex-shrink: 0;
}
.client-meta { flex: 1; min-width: 0; }
.client-name {
  font-weight: 600; font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.client-phone { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
.client-bal { font-weight: 700; font-size: 15px; flex-shrink: 0; }
.bal-debt  { color: var(--red); }
.bal-zero  { color: var(--gray-text); }
.bal-favor { color: var(--green); }

/* ── Profile header ── */
.profile-top {
  background: var(--card);
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 14px; align-items: flex-start;
}
.avatar-lg {
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 22px; flex-shrink: 0;
}
.profile-info h2 { font-size: 19px; font-weight: 700; }
.profile-info p  { color: var(--text-sub); font-size: 14px; margin-top: 3px; }
.profile-btns { display: flex; gap: 8px; margin-top: 10px; }
.btn-sm {
  flex: 1; padding: 7px 10px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; cursor: pointer; border: none;
}
.btn-sm-edit   { background: var(--bg);   color: var(--text); border: 1.5px solid var(--border); }
.btn-sm-del    { background: var(--red-bg); color: var(--red); }
.btn-sm:active { opacity: .8; }

/* ── Balance summary ── */
.balance-box {
  background: var(--card); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 6px;
  box-shadow: 0 1px 3px rgba(0,0,0,.07);
}
.balance-box .lbl {
  font-size: 11px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-sub); font-weight: 600;
}
.balance-box .val {
  font-size: 26px; font-weight: 700; margin-top: 2px;
}

/* ── Section heading ── */
.section-head {
  font-size: 12px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-sub); font-weight: 600;
  margin: 14px 0 6px;
}

/* ── Lancamento card ── */
.lanc-card {
  background: var(--card); border-radius: var(--radius);
  padding: 13px 14px; margin-bottom: 7px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  border-left: 4px solid var(--border);
}
.lanc-card.fiado    { border-left-color: var(--red); }
.lanc-card.pagamento{ border-left-color: var(--green); }

.lanc-row { display: flex; justify-content: space-between; align-items: flex-start; }
.lanc-tipo {
  font-size: 11px; text-transform: uppercase;
  font-weight: 700; letter-spacing: .5px;
}
.lanc-tipo.fiado    { color: var(--red); }
.lanc-tipo.pagamento{ color: var(--green); }
.lanc-date { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
.lanc-val  { font-weight: 700; font-size: 16px; }
.lanc-val.fiado    { color: var(--red); }
.lanc-val.pagamento{ color: var(--green); }
.lanc-obs  { font-size: 13px; color: var(--text-sub); margin-top: 6px; }

.lanc-right { display: flex; align-items: center; gap: 8px; }
.btn-del-lanc {
  background: none; border: none; cursor: pointer;
  color: var(--gray-text); font-size: 14px; padding: 2px 4px;
  border-radius: 4px; line-height: 1;
}
.btn-del-lanc:active { color: var(--red); }

/* ── Toggle ── */
.toggle-wrap {
  display: flex; border: 1.5px solid var(--border);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 14px;
}
.toggle-opt {
  flex: 1; padding: 13px; border: none; background: transparent;
  font-size: 15px; font-weight: 600; cursor: pointer;
  color: var(--text-sub); transition: background .2s, color .2s;
}
.toggle-opt.sel-fiado    { background: var(--red);   color: #fff; }
.toggle-opt.sel-pagamento{ background: var(--green);  color: #fff; }

/* ── Empty state ── */
.empty {
  text-align: center; padding: 48px 16px;
  color: var(--text-sub); font-size: 15px; line-height: 1.5;
}

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: calc(88px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: #222; color: #fff;
  padding: 9px 18px; border-radius: 20px;
  font-size: 14px; z-index: 9999;
  opacity: 0; transition: opacity .28s;
  white-space: nowrap; pointer-events: none;
  max-width: calc(100% - 32px);
  text-align: center;
}
#toast.show { opacity: 1; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.48);
  z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 20px 16px;
  padding-bottom: calc(32px + env(safe-area-inset-bottom));
  width: 100%; max-width: 430px;
}
.modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
.modal-stack { display: flex; flex-direction: column; gap: 10px; }

/* ── Login ── */
#screen-login {
  background: var(--primary);
  justify-content: center; align-items: center;
}
.login-box { width: 100%; padding: 32px 24px; }
.login-logo { text-align: center; margin-bottom: 36px; }
.login-logo h2 { color: #fff; font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.login-logo p  { color: rgba(255,255,255,.45); font-size: 14px; margin-top: 4px; }
.login-box .form-control {
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.15);
  color: #fff; text-align: center;
  letter-spacing: 6px; font-size: 22px;
}
.login-box .form-control::placeholder {
  letter-spacing: 0; font-size: 14px; color: rgba(255,255,255,.3);
}
.login-box .form-control:focus { border-color: var(--accent); }
.login-err {
  color: #ff8a9b; font-size: 13px; text-align: center;
  margin-top: 6px; min-height: 20px;
}

/* ── Divider ── */
.divider { height: 1px; background: var(--border); margin: 12px 0; }

/* ── Sort chips ── */
.sort-row {
  display: flex; gap: 7px;
  overflow-x: auto; padding-bottom: 4px;
  margin-bottom: 14px;
  scrollbar-width: none;
}
.sort-row::-webkit-scrollbar { display: none; }
.sort-chip {
  flex-shrink: 0; padding: 7px 13px;
  border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--card); color: var(--text-sub);
  font-size: 13px; font-weight: 600; cursor: pointer;
  white-space: nowrap;
}
.sort-chip.active {
  background: var(--primary); color: #fff; border-color: var(--primary);
}
.sort-chip:active { opacity: .75; }

/* ── iOS search input ── */
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

/* ── Login safe area ── */
#screen-login {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── Utility ── */
.mt-8 { margin-top: 8px; }
</style>
</head>
<body>

<!-- Toast -->
<div id="toast"></div>

<!-- Modal: Import / Export -->
<div class="modal-overlay" id="modal-io">
  <div class="modal">
    <h3>Importar / Exportar</h3>
    <div class="modal-stack">
      <button class="btn btn-dark" onclick="exportarDados()">Exportar backup JSON</button>
      <button class="btn btn-green" onclick="document.getElementById('file-import').click()">Importar backup JSON</button>
      <input type="file" id="file-import" accept=".json" style="display:none" onchange="importarDados(event)">
      <div class="divider"></div>
      <button class="btn btn-neutral" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     TELA: LOGIN
══════════════════════════════ -->
<div class="screen active" id="screen-login">
  <div class="login-box">
    <div class="login-logo">
      <h2>Fiado</h2>
      <p>Controle de fiado do salao</p>
    </div>
    <div class="form-group">
      <label style="color:rgba(255,255,255,.45)">Senha</label>
      <input type="password" class="form-control" id="input-senha"
             placeholder="Digite a senha"
             onkeydown="if(event.key==='Enter') fazerLogin()">
    </div>
    <div class="login-err" id="login-erro"></div>
    <button class="btn btn-primary mt-8" onclick="fazerLogin()">Entrar</button>
  </div>
</div>

<!-- ══════════════════════════════
     TELA: LISTA DE CLIENTES
══════════════════════════════ -->
<div class="screen" id="screen-lista">
  <div class="header">
    <h1>Clientes</h1>
    <div class="header-actions">
      <button class="btn-icon" title="Importar / Exportar" onclick="abrirModal()">&#8645;</button>
      <button class="btn-icon" title="Sair" onclick="sair()">&#x2715;</button>
    </div>
  </div>
  <div class="content pb-fab">
    <div class="search-wrap">
      <span class="search-icon">&#9906;</span>
      <input type="search" class="form-control" id="input-busca"
             placeholder="Nome ou telefone..." oninput="filtrarClientes()">
    </div>
    <div class="sort-row" id="sort-row">
      <button class="sort-chip active" id="btn-divida" onclick="toggleOrdem('divida')">Dívida <span id="arrow-divida">↓</span></button>
      <button class="sort-chip"        id="btn-az"     onclick="toggleOrdem('az')">A–Z <span id="arrow-az">↑</span></button>
    </div>
    <div id="lista-clientes"></div>
  </div>
  <button class="btn-fab" onclick="irCadastro(null)">+</button>
</div>

<!-- ══════════════════════════════
     TELA: CADASTRO DE CLIENTE
══════════════════════════════ -->
<div class="screen" id="screen-cadastro">
  <div class="header">
    <button class="btn-back" onclick="voltarLista()">&#8592;</button>
    <h1 id="titulo-cadastro">Novo Cliente</h1>
  </div>
  <div class="content">
    <input type="hidden" id="cad-id">
    <div class="form-group">
      <label>Nome</label>
      <input type="text" class="form-control" id="cad-nome" placeholder="Nome completo">
    </div>
    <div class="form-group">
      <label>Celular</label>
      <input type="tel" class="form-control" id="cad-cel"
             placeholder="(00) 00000-0000" oninput="maskPhone(this)">
    </div>
    <button class="btn btn-primary mt-8" onclick="salvarCliente()">Salvar</button>
  </div>
</div>

<!-- ══════════════════════════════
     TELA: PERFIL DO CLIENTE
══════════════════════════════ -->
<div class="screen" id="screen-perfil">
  <div class="header">
    <button class="btn-back" onclick="voltarLista()">&#8592;</button>
    <h1>Perfil</h1>
  </div>
  <div id="perfil-top" class="profile-top"></div>
  <div class="content pb-fab">
    <div class="section-head">Saldo atual</div>
    <div class="balance-box">
      <div class="lbl">Total devedor</div>
      <div class="val" id="perfil-saldo">R$ 0,00</div>
    </div>
    <div class="section-head">Lancamentos</div>
    <div id="perfil-lancs"></div>
  </div>
  <button class="btn-fab" onclick="irLancamento()">+</button>
</div>

<!-- ══════════════════════════════
     TELA: NOVO LANCAMENTO
══════════════════════════════ -->
<div class="screen" id="screen-lancamento">
  <div class="header">
    <button class="btn-back" onclick="voltarPerfil()">&#8592;</button>
    <h1>Novo Lancamento</h1>
  </div>
  <div class="content">
    <div class="form-group">
      <label>Tipo</label>
      <div class="toggle-wrap">
        <button class="toggle-opt sel-fiado"    id="tog-fiado"    onclick="setTipo('fiado')">Fiado</button>
        <button class="toggle-opt"              id="tog-pagamento" onclick="setTipo('pagamento')">Pagamento</button>
      </div>
    </div>
    <div class="form-group">
      <label>Valor (R$)</label>
      <input type="text" inputmode="decimal" class="form-control" id="lanc-valor"
             placeholder="0,00" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Data</label>
      <input type="date" class="form-control" id="lanc-data">
    </div>
    <div class="form-group">
      <label>Observacao (opcional)</label>
      <input type="text" class="form-control" id="lanc-obs" placeholder="Ex: corte + barba">
    </div>
    <button class="btn btn-primary mt-8" onclick="salvarLancamento()">Salvar</button>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
// Estado global
// ────────────────────────────────────────────────
let clienteAtual = null;
let tipoAtual    = 'fiado';
let ordemAtual   = 'divida-desc';

// ────────────────────────────────────────────────
// Storage helpers
// ────────────────────────────────────────────────
const getClientes    = () => JSON.parse(localStorage.getItem('clientes')    || '[]');
const setClientes    = v  => localStorage.setItem('clientes',    JSON.stringify(v));
const getLancamentos = () => JSON.parse(localStorage.getItem('lancamentos') || '[]');
const setLancamentos = v  => localStorage.setItem('lancamentos', JSON.stringify(v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ────────────────────────────────────────────────
// Navegacao
// ────────────────────────────────────────────────
function ir(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function voltarLista() {
  document.getElementById('input-busca').value = '';
  renderLista('', ordemAtual);
  ir('screen-lista');
}

function voltarPerfil() {
  renderPerfil(clienteAtual);
  ir('screen-perfil');
}

function irCadastro(clienteId) {
  const edt = clienteId ? getClientes().find(c => c.id === clienteId) : null;
  document.getElementById('cad-id').value   = edt ? edt.id     : '';
  document.getElementById('cad-nome').value = edt ? edt.nome   : '';
  document.getElementById('cad-cel').value  = edt ? edt.celular: '';
  document.getElementById('titulo-cadastro').textContent = edt ? 'Editar Cliente' : 'Novo Cliente';
  ir('screen-cadastro');
}

function irPerfil(clienteId) {
  const c = getClientes().find(x => x.id === clienteId);
  if (!c) return;
  clienteAtual = c;
  renderPerfil(c);
  ir('screen-perfil');
}

function irLancamento() {
  setTipo('fiado');
  document.getElementById('lanc-valor').value = '';
  document.getElementById('lanc-obs').value   = '';
  document.getElementById('lanc-data').value  = hoje();
  ir('screen-lancamento');
}

// ────────────────────────────────────────────────
// Login
// ────────────────────────────────────────────────
function fazerLogin() {
  const senha = document.getElementById('input-senha').value;
  document.getElementById('input-senha').value = '';
  if (senha === '1993') {
    document.getElementById('login-erro').textContent = '';
    renderLista('', ordemAtual);
    ir('screen-lista');
  } else {
    document.getElementById('login-erro').textContent = 'Senha incorreta.';
    document.getElementById('input-senha').focus();
  }
}

function sair() {
  ir('screen-login');
  setTimeout(() => document.getElementById('input-senha').focus(), 50);
}

// ────────────────────────────────────────────────
// Financeiro
// ────────────────────────────────────────────────
function calcSaldo(clienteId) {
  return getLancamentos()
    .filter(l => l.clienteId === clienteId)
    .reduce((acc, l) => l.tipo === 'fiado'
      ? acc + parseFloat(l.valor)
      : acc - parseFloat(l.valor), 0);
}

function fmtMoeda(v) {
  return 'R$ ' + Math.abs(v).toFixed(2).replace('.', ',');
}

function fmtData(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y}`;
}

function hoje() {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0')
  ].join('-');
}

function iniciais(nome) {
  const p = nome.trim().split(/\s+/);
  return p.length === 1
    ? p[0][0].toUpperCase()
    : (p[0][0] + p[p.length - 1][0]).toUpperCase();
}

function classBal(saldo) {
  if (saldo > 0) return 'bal-debt';
  if (saldo < 0) return 'bal-favor';
  return 'bal-zero';
}

// ────────────────────────────────────────────────
// Lista de clientes
// ────────────────────────────────────────────────
function toggleOrdem(tipo) {
  if (tipo === 'divida') {
    ordemAtual = ordemAtual === 'divida-desc' ? 'divida-asc' : 'divida-desc';
    document.getElementById('arrow-divida').textContent = ordemAtual === 'divida-desc' ? '↓' : '↑';
    document.getElementById('btn-divida').classList.add('active');
    document.getElementById('btn-az').classList.remove('active');
  } else {
    ordemAtual = ordemAtual === 'az' ? 'za' : 'az';
    document.getElementById('arrow-az').textContent = ordemAtual === 'az' ? '↑' : '↓';
    document.getElementById('btn-az').classList.add('active');
    document.getElementById('btn-divida').classList.remove('active');
  }
  filtrarClientes();
}

function renderLista(filtro, ordem) {
  filtro = (filtro || '').toLowerCase().trim();
  ordem  = ordem || ordemAtual;

  let lista = getClientes();

  if (filtro) {
    lista = lista.filter(c =>
      c.nome.toLowerCase().includes(filtro) ||
      (c.celular || '').replace(/\D/g, '').includes(filtro.replace(/\D/g, ''))
    );
  }

  // pre-calcula saldo para nao chamar calcSaldo duas vezes no sort
  const comSaldo = lista.map(c => ({ c, saldo: calcSaldo(c.id) }));

  comSaldo.sort((a, b) => {
    switch (ordem) {
      case 'divida-desc': return b.saldo - a.saldo;
      case 'divida-asc':  return a.saldo - b.saldo;
      case 'az':          return a.c.nome.localeCompare(b.c.nome);
      case 'za':          return b.c.nome.localeCompare(a.c.nome);
      default:            return 0;
    }
  });

  const el = document.getElementById('lista-clientes');
  if (!comSaldo.length) {
    el.innerHTML = `<div class="empty">${
      filtro ? 'Nenhum cliente encontrado.' : 'Nenhum cliente cadastrado.<br>Toque em + para adicionar.'
    }</div>`;
    return;
  }

  el.innerHTML = comSaldo.map(({ c, saldo }) => {
    const cls = classBal(saldo);
    const txt = fmtMoeda(saldo);
    return `
    <div class="card card-tap" onclick="irPerfil('${c.id}')">
      <div class="client-row">
        <div class="avatar">${iniciais(c.nome)}</div>
        <div class="client-meta">
          <div class="client-name">${esc(c.nome)}</div>
          <div class="client-phone">${esc(c.celular) || '—'}</div>
        </div>
        <div class="client-bal ${cls}">${txt}</div>
      </div>
    </div>`;
  }).join('');
}

function filtrarClientes() {
  renderLista(document.getElementById('input-busca').value, ordemAtual);
}

// ────────────────────────────────────────────────
// Cadastro
// ────────────────────────────────────────────────
function salvarCliente() {
  const nome    = document.getElementById('cad-nome').value.trim();
  const celular = document.getElementById('cad-cel').value.trim();
  const id      = document.getElementById('cad-id').value;

  if (!nome) { toast('Informe o nome do cliente.'); document.getElementById('cad-nome').focus(); return; }

  let lista = getClientes();
  if (id) {
    const idx = lista.findIndex(c => c.id === id);
    if (idx >= 0) { lista[idx].nome = nome; lista[idx].celular = celular; }
    // se era o cliente atual, atualiza referencia
    if (clienteAtual && clienteAtual.id === id) {
      clienteAtual = { ...clienteAtual, nome, celular };
    }
  } else {
    lista.push({ id: uid(), nome, celular });
  }

  setClientes(lista);
  toast('Cliente salvo!');
  voltarLista();
}

// ────────────────────────────────────────────────
// Perfil
// ────────────────────────────────────────────────
function renderPerfil(c) {
  const saldo = calcSaldo(c.id);
  const cls   = classBal(saldo);

  document.getElementById('perfil-top').innerHTML = `
    <div class="avatar-lg">${iniciais(c.nome)}</div>
    <div class="profile-info">
      <h2>${esc(c.nome)}</h2>
      <p>${esc(c.celular) || 'Sem telefone'}</p>
      <div class="profile-btns">
        <button class="btn-sm btn-sm-edit" onclick="irCadastro('${c.id}')">Editar</button>
        <button class="btn-sm btn-sm-del"  onclick="excluirCliente('${c.id}')">Excluir</button>
      </div>
    </div>`;

  const salEl = document.getElementById('perfil-saldo');
  salEl.textContent = fmtMoeda(saldo);
  salEl.className   = 'val ' + cls;

  const lancs = getLancamentos()
    .filter(l => l.clienteId === c.id)
    .sort((a, b) => b.data.localeCompare(a.data) || b.id.localeCompare(a.id));

  const container = document.getElementById('perfil-lancs');
  if (!lancs.length) {
    container.innerHTML = '<div class="empty">Nenhum lancamento registrado.</div>';
    return;
  }

  container.innerHTML = lancs.map(l => {
    const sinal = l.tipo === 'fiado' ? '+' : '-';
    const obs   = l.observacao ? `<div class="lanc-obs">${esc(l.observacao)}</div>` : '';
    return `
    <div class="lanc-card ${l.tipo}">
      <div class="lanc-row">
        <div>
          <div class="lanc-tipo ${l.tipo}">${l.tipo === 'fiado' ? 'Fiado' : 'Pagamento'}</div>
          <div class="lanc-date">${fmtData(l.data)}</div>
        </div>
        <div class="lanc-right">
          <div class="lanc-val ${l.tipo}">${sinal} ${fmtMoeda(parseFloat(l.valor))}</div>
          <button class="btn-del-lanc" onclick="excluirLanc('${l.id}')" title="Excluir">&#x2715;</button>
        </div>
      </div>
      ${obs}
    </div>`;
  }).join('');
}

function excluirCliente(clienteId) {
  if (!confirm('Excluir este cliente e todos os seus lancamentos?')) return;
  setClientes(getClientes().filter(c => c.id !== clienteId));
  setLancamentos(getLancamentos().filter(l => l.clienteId !== clienteId));
  toast('Cliente excluido.');
  voltarLista();
}

// ────────────────────────────────────────────────
// Lancamento
// ────────────────────────────────────────────────
function setTipo(tipo) {
  tipoAtual = tipo;
  document.getElementById('tog-fiado').className    = 'toggle-opt' + (tipo === 'fiado'     ? ' sel-fiado'     : '');
  document.getElementById('tog-pagamento').className = 'toggle-opt' + (tipo === 'pagamento' ? ' sel-pagamento' : '');
}

function salvarLancamento() {
  const valorRaw = document.getElementById('lanc-valor').value.replace(',', '.');
  const valor    = parseFloat(valorRaw);
  const data     = document.getElementById('lanc-data').value;
  const obs      = document.getElementById('lanc-obs').value.trim();

  if (!valor || valor <= 0) {
    toast('Informe um valor valido.');
    document.getElementById('lanc-valor').focus();
    return;
  }
  if (!data) { toast('Informe a data.'); return; }

  const lancs = getLancamentos();
  lancs.push({
    id: uid(),
    clienteId: clienteAtual.id,
    tipo: tipoAtual,
    valor: valor.toFixed(2),
    data,
    observacao: obs
  });
  setLancamentos(lancs);
  toast('Lancamento salvo!');
  voltarPerfil();
}

function excluirLanc(id) {
  if (!confirm('Excluir este lancamento?')) return;
  setLancamentos(getLancamentos().filter(l => l.id !== id));
  renderPerfil(clienteAtual);
  toast('Lancamento excluido.');
}

// ────────────────────────────────────────────────
// Importar / Exportar
// ────────────────────────────────────────────────
function abrirModal() { document.getElementById('modal-io').classList.add('open'); }
function fecharModal() { document.getElementById('modal-io').classList.remove('open'); }

function exportarDados() {
  fecharModal();
  const payload = {
    exportadoEm: new Date().toISOString(),
    clientes:    getClientes(),
    lancamentos: getLancamentos()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), {
    href: url,
    download: `fiado-backup-${hoje()}.json`
  });
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exportado!');
}

function importarDados(event) {
  fecharModal();
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!Array.isArray(d.clientes) || !Array.isArray(d.lancamentos)) {
        toast('Arquivo invalido.');
        return;
      }
      if (!confirm(
        `Importar ${d.clientes.length} cliente(s) e ${d.lancamentos.length} lancamento(s)?` +
        '\n\nOs dados atuais serao substituidos.'
      )) return;
      setClientes(d.clientes);
      setLancamentos(d.lancamentos);
      renderLista('', ordemAtual);
      toast('Dados importados!');
    } catch {
      toast('Erro ao ler o arquivo.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ────────────────────────────────────────────────
// Utilitarios
// ────────────────────────────────────────────────
function maskPhone(el) {
  let v = el.value.replace(/\D/g, '').slice(0, 11);
  if      (v.length > 7) v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
  else if (v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
  el.value = v;
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

let _toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// fecha modal ao clicar fora
document.getElementById('modal-io').addEventListener('click', e => {
  if (e.target === e.currentTarget) fecharModal();
});

// ────────────────────────────────────────────────
// Boot
// ────────────────────────────────────────────────
document.getElementById('input-senha').focus();
</script>
