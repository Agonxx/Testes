<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Anotações de Inglês</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>English Notes</h1>
    <p>Minhas anotações de inglês organizadas por nível</p>
    <div class="search-wrapper">
      <input type="text" id="search" placeholder="Search topics..." autocomplete="off" spellcheck="false" />
    </div>
  </header>

  <nav id="menu"></nav>

  <main>

    <p id="no-results" class="no-results" style="display:none">
      Nenhum tópico encontrado. Tente outra busca.
    </p>

    <section class="level-section" id="section-beginner">
      <h2 class="level-title beginner">Beginner</h2>
      <div class="topics" id="topics-beginner"></div>
    </section>

    <section class="level-section" id="section-intermediate">
      <h2 class="level-title intermediate">Intermediate</h2>
      <div class="topics" id="topics-intermediate"></div>
    </section>

    <section class="level-section" id="section-advanced">
      <h2 class="level-title advanced">Advanced</h2>
      <div class="topics" id="topics-advanced"></div>
    </section>

  </main>

  <footer>English Notes &copy; 2026</footer>

  <script src="menu.js"></script>
  <script>
    const levelLabels = {
      beginner:     'Beginner',
      intermediate: 'Intermediate',
      advanced:     'Advanced',
    };

    // Gera os cards agrupados por nível
    const cardElements = [];

    topics.forEach(topic => {
      const container = document.getElementById('topics-' + topic.level);
      if (!container) return;

      const card = document.createElement('a');
      card.href = topic.file;
      card.className = 'topic-card ' + topic.level;
      card.dataset.title = topic.title.toLowerCase();
      card.dataset.desc  = topic.desc.toLowerCase();

      const badge = `<span class="badge ${topic.level}">${levelLabels[topic.level] || topic.level}</span>`;
      card.innerHTML = `${badge}<h3>${topic.title}</h3><p>${topic.desc}</p>`;

      container.appendChild(card);
      cardElements.push(card);
    });

    // Busca em tempo real
    const searchInput = document.getElementById('search');
    const noResults   = document.getElementById('no-results');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase().trim();

      cardElements.forEach(card => {
        const match = !q || card.dataset.title.includes(q) || card.dataset.desc.includes(q);
        card.style.display     = match ? '' : 'none';
        card.dataset.visible   = match ? '1' : '0';
      });

      // Mostra/oculta seções sem resultado
      let totalVisible = 0;
      ['beginner', 'intermediate', 'advanced'].forEach(lvl => {
        const section = document.getElementById('section-' + lvl);
        const count   = section.querySelectorAll('[data-visible="1"]').length;
        section.style.display = count === 0 ? 'none' : '';
        totalVisible += count;
      });

      noResults.style.display = totalVisible === 0 ? '' : 'none';
    });
  </script>

</body>
</html>
